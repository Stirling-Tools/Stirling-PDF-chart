extraArgs:
  []
  # - --storage-timestamp-tolerance 1s
replicaCount: 1
strategy:
  type: RollingUpdate
image:
  registry: docker.stirlingpdf.com
  repository: stirlingtools/stirling-pdf
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  sha: ""
  pullPolicy: IfNotPresent
secret:
  labels: {}
# -- Labels to apply to all resources
commonLabels: {}
# team_name: dev

# -- Rootpath for the application
rootPath: /

# -- Environment variables to add to the stirling-pdf pods.
# -- Any key from the settings file can be set as an env var: uppercase the dotted
# -- path and join segments with "_" (e.g. security.oauth2.client.google.clientId ->
# -- SECURITY_OAUTH2_CLIENT_GOOGLE_CLIENTID). For the full, authoritative list see
# -- https://github.com/Stirling-Tools/Stirling-PDF/blob/main/app/core/src/main/resources/settings.yml.template
# -- For secrets (passwords, client secrets, license keys) prefer envsFrom with a Secret.
envs: []
# --- Branding / UI ---
# - name: UI_APPNAMENAVBAR                 # browser tab title + TOTP/2FA issuer label
#   value: "Stirling PDF"
# - name: UI_LOGOSTYLE                     # 'classic' or 'modern'
#   value: "classic"
# - name: UI_LANGUAGES                     # restrict languages; empty = all. e.g. "en_GB,de_DE"
#   value: ""
# - name: SYSTEM_DEFAULTLOCALE             # force default language, e.g. "en-GB". Empty = auto-detect
#   value: "en-GB"
#
# --- General system ---
# - name: SYSTEM_FILEUPLOADLIMIT           # e.g. "100MB"; empty = no limit
#   value: ""
# - name: SYSTEM_MAXDPI                    # max DPI for PDF-to-image conversion
#   value: "500"
# - name: SYSTEM_GOOGLEVISIBILITY          # 'true' allows search engine indexing (robots.txt)
#   value: "false"
# - name: SYSTEM_SHOWUPDATE                # show when a new update is available
#   value: "true"
# - name: SYSTEM_ENABLEANALYTICS           # 'true'/'false'/'null' (prompt admin on first launch)
#   value: "false"
# - name: SYSTEM_CUSTOMHTMLFILES           # allow /customFiles/templates to override template HTML
#   value: "false"
# - name: SYSTEM_TESSDATADIR               # path to Tessdata (OCR) directory
#   value: ""
# - name: METRICS_ENABLED                  # expose /api/* info endpoints (health probes use these)
#   value: "true"
#
# --- URLs / SSO callbacks / mobile scanner ---
# - name: SYSTEM_BACKENDURL                # required for SAML/OAuth callbacks, e.g. https://api.example.com
#   value: ""
# - name: SYSTEM_FRONTENDURL               # used for invite email + share links, e.g. https://app.example.com
#   value: ""
# - name: SYSTEM_ENABLEMOBILESCANNER       # QR-code mobile upload (requires frontendUrl)
#   value: "true"
# - name: SYSTEM_CORSALLOWEDORIGINS        # comma-separated origins; empty = allow all (with credentials)
#   value: ""
#
# --- Login & authentication ---
# - name: SECURITY_ENABLELOGIN             # enable user accounts / login
#   value: "false"
# - name: SECURITY_LOGINMETHOD             # 'all', 'normal', 'oauth2' or 'saml2'
#   value: "all"
# - name: SECURITY_INITIALLOGIN_USERNAME   # bootstrap admin username (first launch)
#   value: ""
# - name: SECURITY_INITIALLOGIN_PASSWORD   # bootstrap admin password (use envsFrom Secret)
#   value: ""
# - name: SECURITY_OAUTH2_ENABLED
#   value: "false"
# - name: SECURITY_OAUTH2_ISSUER           # OpenID Connect discovery URL
#   value: ""
# - name: SECURITY_OAUTH2_CLIENTID
#   value: ""
# - name: SECURITY_OAUTH2_CLIENTSECRET     # use envsFrom Secret
#   value: ""
# - name: SECURITY_SAML2_ENABLED           # enterprise licence required
#   value: "false"
#
# --- Custom (external) database - Pro/Enterprise ---
# - name: SYSTEM_DATASOURCE_ENABLECUSTOMDATABASE
#   value: "false"
# - name: SYSTEM_DATASOURCE_TYPE           # 'postgresql' or 'h2'
#   value: "postgresql"
# - name: SYSTEM_DATASOURCE_HOSTNAME
#   value: "localhost"
# - name: SYSTEM_DATASOURCE_PORT
#   value: "5432"
# - name: SYSTEM_DATASOURCE_NAME
#   value: "postgres"
# - name: SYSTEM_DATASOURCE_USERNAME
#   value: "postgres"
# - name: SYSTEM_DATASOURCE_PASSWORD       # use envsFrom Secret
#   value: "postgres"
#
# --- Mail (invites / notifications) ---
# - name: MAIL_ENABLED
#   value: "false"
# - name: MAIL_HOST
#   value: "smtp.example.com"
# - name: MAIL_PORT
#   value: "587"
# - name: MAIL_USERNAME
#   value: ""
# - name: MAIL_PASSWORD                    # use envsFrom Secret
#   value: ""
# - name: MAIL_FROM
#   value: ""
#
# --- Pro / Enterprise licence ---
# - name: PREMIUM_ENABLED                  # enable Pro/Enterprise licence checks
#   value: "false"
# - name: PREMIUM_KEY                      # licence key (use envsFrom Secret)
#   value: "00000000-0000-0000-0000-000000000000"
#
# --- AI engine (optional) ---
# - name: AIENGINE_ENABLED
#   value: "false"
# - name: AIENGINE_URL
#   value: "http://localhost:5001"
#
# --- MCP server (optional) ---
# - name: MCP_ENABLED
#   value: "false"
# - name: MCP_AUTH_MODE                    # 'oauth' or 'apikey'
#   value: "oauth"
#
# --- Disable specific tools / groups ---
# - name: ENDPOINTS_TOREMOVE               # comma-separated, e.g. "img-to-pdf,remove-pages"
#   value: ""
# - name: ENDPOINTS_GROUPSTOREMOVE         # comma-separated, e.g. "LibreOffice,Automation"
#   value: ""
#
# --- Docker image / entrypoint flags (not part of settings.yml) ---
# - name: DISABLE_ADDITIONAL_FEATURES      # 'false' downloads the login/security jar at startup
#   value: "false"
# - name: FAT_DOCKER                       # 'true' when using the -fat image (all deps preinstalled)
#   value: "false"
# - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS  # install calibre for advanced HTML/book ops (non-fat)
#   value: "false"
# - name: PUID                             # run-as user id (must match securityContext.fsGroup)
#   value: "1000"
# - name: PGID                             # run-as group id
#   value: "1000"
# - name: UMASK
#   value: "022"

# -- Environment variables from secrets or configmaps to add to the stirling-pdf pods
envsFrom: []
# - configMapRef:
#     name: config
# - secretRef:
#     name: config

deployment:
  # -- Stirling-pdf Deployment annotations
  annotations: {}
  #   name: value
  labels: {}
  #   name: value
  # -- Additional volumes
  extraVolumes: []
  #  - name: nginx-config
  #    secret:
  #      secretName: nginx-config
  # -- Additional volumes to mount
  extraVolumeMounts: []
  # -- sidecarContainers for the stirling-pdf
  # -- Can be used to add a proxy to the pod that does
  # -- scanning for secrets, signing, authentication, validation
  # -- of the chart's content, send notifications...
  sidecarContainers: {}
  ## Example sidecarContainer which uses an extraVolume from above and
  ## a named port that can be referenced in the service as targetPort.
  #  proxy:
  #    image: nginx:latest
  #    ports:
  #      - name: proxy
  #        containerPort: 8081
  #    volumeMounts:
  #      - name: nginx-config
  #        readOnly: true
  #        mountPath: /etc/nginx

# -- Pod annotations
# -- ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
# -- Read more about kube2iam to provide access to s3 https://github.com/jtblin/kube2iam
podAnnotations:
  {}
  # iam.amazonaws.com/role: role-arn

# -- Pod labels
# -- ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels:
  {}
  # name: value

service:
  servicename:
  type: ClusterIP
  # -- set the ip family policy to configure dual-stack
  ipFamilyPolicy: ""
  # -- Can be IPv4 and/or IPv6
  ipFamilies: []
  externalTrafficPolicy: Local
  # -- Uses pre-assigned IP address from cloud provider
  # -- Only valid if service.type: LoadBalancer
  loadBalancerIP:
  # -- Limits which cidr blocks can connect to service's load balancer
  # -- Only valid if service.type: LoadBalancer
  loadBalancerSourceRanges: []
  # clusterIP: None
  externalPort: 8080
  # -- targetPort of the container to use. If a sidecar should handle the
  # -- requests first, use the named port from the sidecar. See sidecar example
  # -- from deployment above. Leave empty to use stirling-pdf directly.
  targetPort:
  nodePort:
  annotations: {}
  labels: {}

serviceMonitor:
  enabled: false
  # namespace: prometheus
  labels: {}
  metricsPath: "/metrics"
  # timeout: 60
  # interval: 60

resources: {}
#  limits:
#    cpu: 100m
#    memory: 128Mi
#  requests:
#    cpu: 80m
#    memory: 64Mi

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
  livenessHttpGetConfig:
    scheme: HTTP
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
  readinessHttpGetConfig:
    scheme: HTTP

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  ## Annotations for the Service Account
  annotations: {}

# -- UID/GID 1000 is the default user "stirling-pdf" used in
# -- the container image starting in v0.8.0 and above. This
# -- is required for local persistent storage. If your cluster
# -- does not allow this, try setting securityContext: {}
securityContext:
  enabled: true
  fsGroup: 1000
  ## Optionally, specify supplementalGroups and/or
  ## runAsNonRoot for security purposes
  # runAsNonRoot: true
  # supplementalGroups: [1000]

containerSecurityContext: {}

priorityClassName: ""

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 8Gi
  labels:
    {}
    # name: value
  path: /tmp
  ## A manually managed Persistent Volume and Claim
  ## Requires persistence.enabled: true
  ## If defined, PVC must be created manually before volume will be bound
  # existingClaim:

  # -- stirling-pdf data Persistent Volume Storage Class
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  #   set, choosing the default provisioner.  (gp2 on AWS, standard on
  #   GKE, AWS & OpenStack)
  # storageClass: "-"
  # volumeName:
  pv:
    enabled: false
    pvname:
    capacity:
      storage: 8Gi
    accessMode: ReadWriteOnce
    nfs:
      server:
      path:

# -- Init containers parameters:
# -- volumePermissions: Change the owner of the persistent volume mountpoint to RunAsUser:fsGroup
volumePermissions:
  image:
    registry: docker.io
    repository: bitnami/minideb
    tag: buster
    pullPolicy: Always
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    ##
    # pullSecrets:
    #   - myRegistryKeySecretName

# -- Ingress for load balancer
ingress:
  enabled: false
  pathType: "ImplementationSpecific"
  # -- Stirling-pdf Ingress labels
  labels:
    {}
    # dns: "route53"

  # -- Stirling-pdf Ingress annotations
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  # -- Stirling-pdf Ingress hostnames
  # -- Must be provided if Ingress is enabled
  hosts:
    []
    # - name: stirling-pdf.domain1.com
    #   path: /
    #   tls: false
    # - name: stirling-pdf.domain2.com
    #   path: /
    #
    #   ## Set this to true in order to enable TLS on the ingress record
    #   tls: true
    #
    #   ## If TLS is set to true, you must declare what secret will store the key/certificate for TLS
    #   ## Secrets must be added manually to the namespace
    #   tlsSecret: stirling-pdf.domain2-tls

  # -- For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
  # -- See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
  ingressClassName:
