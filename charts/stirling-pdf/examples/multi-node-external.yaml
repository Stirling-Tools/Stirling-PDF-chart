# Several Stirling-PDF pods using your own PostgreSQL, Valkey (or Redis) and S3 bucket.
# Every credential comes from a Secret you create first, for example:
#
# kubectl create secret generic stirling-licence --from-literal=premium-key=<licence key>
# kubectl create secret generic stirling-db --from-literal=password=<db password>
# kubectl create secret generic stirling-valkey --from-literal=password=<valkey password>
# kubectl create secret generic stirling-s3 --from-literal=access-key=<key id> --from-literal=secret-key=<secret>
# kubectl create secret generic stirling-keys \
#   --from-literal=credential-encryption-key="$(openssl rand -base64 32)" \
#   --from-literal=automatically-generated-key="$(uuidgen)" \
#   --from-literal=automatically-generated-uuid="$(uuidgen)"
#
# helm install stirling-pdf stirling-pdf/stirling-pdf-chart -f multi-node-external.yaml

replicaCount: 3

cluster:
  enabled: true

premium:
  enabled: true
  existingSecret: stirling-licence

# Keys shared by every pod. Back this Secret up: without it, encrypted data in the database is lost.
sharedKeys:
  existingSecret: stirling-keys

externalDatabase:
  host: postgres.example.internal
  port: 5432
  database: stirling
  username: stirling
  existingSecret: stirling-db
  existingSecretPasswordKey: password
  # Or a full JDBC URL, e.g. to require TLS:
  # jdbcUrl: jdbc:postgresql://postgres.example.internal:5432/stirling?sslmode=require

# Must run with maxmemory-policy noeviction
externalValkey:
  host: valkey.example.internal
  port: 6379
  database: 0
  tls: false
  existingSecret: stirling-valkey
  existingSecretPasswordKey: password

# The bucket must already exist
externalS3:
  endpoint: https://s3.eu-west-1.amazonaws.com
  bucket: my-stirling-pdf-bucket
  region: eu-west-1
  pathStyleAccess: false
  existingSecret: stirling-s3
  existingSecretAccessKeyKey: access-key
  existingSecretSecretKeyKey: secret-key

persistence:
  enabled: false

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 3Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: stirling-pdf-chart

ingress:
  enabled: true
  ingressClassName: nginx
  pathType: Prefix
  hosts:
    - name: pdf.example.com
      path: /
      tls: true
      tlsSecret: pdf-example-com-tls
