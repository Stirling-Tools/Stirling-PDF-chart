# One Stirling-PDF pod using a bundled PostgreSQL database instead of the embedded one.
# Needs a Server or Enterprise licence; without one, processing requests get HTTP 402.
#
# kubectl create secret generic stirling-licence --from-literal=premium-key=<your licence key>
# helm install stirling-pdf stirling-pdf/stirling-pdf-chart -f single-node-postgres.yaml

premium:
  enabled: true
  existingSecret: stirling-licence

postgresql:
  enabled: true
  persistence:
    size: 8Gi

# With the database in PostgreSQL, /configs only holds settings changed in the admin UI.
# Keep it if you use the admin UI to change settings.
persistence:
  enabled: true

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 2Gi
