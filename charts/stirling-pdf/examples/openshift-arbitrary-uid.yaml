# For platforms that run pods under a random user id, such as OpenShift's restricted-v2 SCC.
# On OpenShift drop runAsUser, runAsGroup and fsGroup and let the platform assign them.

deployment:
  arbitraryUid: true

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000650000
  runAsGroup: 0
  fsGroup: 1000650000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
