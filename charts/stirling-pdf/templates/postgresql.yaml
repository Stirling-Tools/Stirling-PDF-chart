{{- include "stirlingpdf.checkValues" . }}
{{- if .Values.postgresql.enabled }}
{{- $name := include "stirlingpdf.componentName" (list . "postgresql") }}
{{- $pg := .Values.postgresql }}
{{- if not $pg.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stirlingpdf.componentLabels" (list . "postgresql") | nindent 4 }}
  annotations:
    # The data volume outlives an uninstall; a reinstall must find the same password
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $pg.auth.secretKey }}: {{ include "stirlingpdf.stableSecretValue" (dict "ctx" . "secret" $name "key" $pg.auth.secretKey "value" $pg.auth.password "generate" (randAlphaNum 24)) | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stirlingpdf.componentLabels" (list . "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
  selector:
    {{- include "stirlingpdf.componentSelectorLabels" (list . "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stirlingpdf.componentLabels" (list . "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "stirlingpdf.componentSelectorLabels" (list . "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stirlingpdf.componentSelectorLabels" (list . "postgresql") | nindent 8 }}
    spec:
      {{- with $pg.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with (include "stirlingpdf.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: postgresql
        image: {{ include "stirlingpdf.componentImage" $pg.image | quote }}
        imagePullPolicy: {{ $pg.image.pullPolicy }}
        {{- with $pg.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: POSTGRES_USER
          value: {{ $pg.auth.username | quote }}
        - name: POSTGRES_DB
          value: {{ $pg.auth.database | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "stirlingpdf.postgresql.secretName" . }}
              key: {{ $pg.auth.secretKey }}
        # A subdirectory, because a fresh volume may contain lost+found and initdb needs an empty dir
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgresql
          containerPort: 5432
        startupProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        {{- with $pg.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
      volumes:
      - name: run
        emptyDir: {}
      {{- if not $pg.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "stirlingpdf.componentSelectorLabels" (list . "postgresql") | nindent 8 }}
    spec:
      accessModes:
      - {{ $pg.persistence.accessMode | quote }}
      {{- if $pg.persistence.storageClass }}
      storageClassName: {{ ternary "" $pg.persistence.storageClass (eq "-" $pg.persistence.storageClass) | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ $pg.persistence.size | quote }}
  {{- end }}
{{- end }}
