{{- include "stirlingpdf.checkValues" . }}
{{- if include "stirlingpdf.appSecret.enabled" . }}
{{- $v := .Values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stirlingpdf.appSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stirlingpdf.labels" . | nindent 4 }}
    {{- with .Values.secret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- if and $v.premium.enabled $v.premium.key (not $v.premium.existingSecret) }}
  premium-key: {{ $v.premium.key | b64enc | quote }}
  {{- end }}
  {{- if and $v.externalDatabase.password (not $v.externalDatabase.existingSecret) }}
  database-password: {{ $v.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if and $v.externalValkey.password (not $v.externalValkey.existingSecret) }}
  valkey-password: {{ $v.externalValkey.password | b64enc | quote }}
  {{- end }}
  {{- if and $v.externalS3.accessKey (not $v.externalS3.existingSecret) }}
  s3-access-key: {{ $v.externalS3.accessKey | b64enc | quote }}
  s3-secret-key: {{ $v.externalS3.secretKey | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (include "stirlingpdf.sharedKeys.enabled" .) (not .Values.sharedKeys.existingSecret) }}
{{- $name := include "stirlingpdf.sharedKeysSecretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stirlingpdf.labels" . | nindent 4 }}
    {{- with .Values.secret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Losing these keys makes encrypted data in the database unreadable, so uninstall leaves them
    helm.sh/resource-policy: keep
type: Opaque
data:
  credential-encryption-key: {{ include "stirlingpdf.stableSecretValue" (dict "ctx" . "secret" $name "key" "credential-encryption-key" "value" .Values.sharedKeys.credentialEncryptionKey "generate" (randBytes 32)) | b64enc | quote }}
  automatically-generated-key: {{ include "stirlingpdf.stableSecretValue" (dict "ctx" . "secret" $name "key" "automatically-generated-key" "value" .Values.sharedKeys.automaticallyGeneratedKey "generate" uuidv4) | b64enc | quote }}
  automatically-generated-uuid: {{ include "stirlingpdf.stableSecretValue" (dict "ctx" . "secret" $name "key" "automatically-generated-uuid" "value" .Values.sharedKeys.automaticallyGeneratedUuid "generate" uuidv4) | b64enc | quote }}
{{- end }}
